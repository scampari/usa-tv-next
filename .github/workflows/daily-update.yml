name: Daily stream update

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install ffprobe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable FFmpeg 8.x: the master build rejects some valid HLS
          # playlists, and distro builds lag behind.
          gh release download latest --repo BtbN/FFmpeg-Builds \
            --pattern 'ffmpeg-n8.*-latest-linux64-gpl-8.*.tar.xz' --output ffmpeg.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          rm ffmpeg.tar.xz
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Find, test and add new streams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m harvester run --no-resume

      - name: Remove dead streams
        run: uv run python -m harvester prune

      - name: Remove audio-only and non-US streams
        run: uv run python -m harvester clean

      - name: Check data before publishing
        run: uv run python -m harvester.check --baseline-ref HEAD

      - name: Commit and push
        run: |
          git add catalog meta stream
          if git diff --cached --quiet; then
            echo "No stream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily stream update"
          git push
